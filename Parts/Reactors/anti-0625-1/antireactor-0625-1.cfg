PART
{
	name = OGS-AntiReactor-0625-1
	module = Part
	author = Orange Gaming System
	mesh = Model.mu
	scale = 1
	rescaleFactor = 0.2275
	node_stack_top = -0.0, 1.575, 0.0, 0.0, 1.0, 0.0, 0
	node_stack_bottom = -0.0, -1.575, 0.0, 0.0, -1.0, 0.0, 0
	TechRequired = largeElectrics
	TechHidden = True
	entryCost = 0
	cost = 314250
	category = Electrical
	subcategory = 0
	title = Small Antimatter Reactor (H+H-)
	manufacturer = Annihilation Inc.
	description = A relatively small antimatter reactor that uses very little fuel, but still produces a decent amount of energy. Its efficiency is only 0.045%.
	attachRules = 1,0,1,0,0
	mass = 0.115625
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 10
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 3000
	bulkheadProfiles = size0, srf
	tags = reactor energy antimatter hydrogen
	RESOURCE

	RESOURCE
	{
		name = ElectricCharge
		amount = 0
		maxAmount = 100
	}
MODULE
  {
    name = ModuleSystemHeat
    // Cubic metres
    volume = 0.25
    moduleID = reactorheat
    iconName = Icon_Atom
  }
VABORGANIZER
{
  // The category to assign the part to
  organizerSubcategory = antimatterreactor
}
MODULE
{
	name = ModuleSystemHeatConverter
	moduleID = antimatterreactor
	ConverterName = Antimatter Annihilation
	StartActionName = Start Antimatter Annihilation
	StopActionName = Stop Antimatter Annihilation
	AutoShutdown = true

	// ModuleSystemHeat moduleID to link to
	systemHeatModuleID = reactorheat
	// The shutdown temperature of the part
	shutdownTemperature = 1300

	// The temperature the system contributes to loops
	systemOutletTemperature = 1000

	// Map loop temperature to system efficiency (0-1.0)
	systemEfficiency
	{
    	key = 0 0.0
    	key = 1000 1.0
    	key = 1300 1.0
	}
	// Heat generation (kW)
	systemPower = 3125

	// Maintain 13:1000 ratio between Antimatter LqdHydrogen

	INPUT_RESOURCE
	{
 		ResourceName = LqdHydrogen
 		Ratio = 0.00000036111
 		FlowMode = STAGE_PRIORITY_FLOW
	}
 	INPUT_RESOURCE
 	{
 		ResourceName = Antimatter
 		Ratio = 0.000027777776666667
 	}
 	OUTPUT_RESOURCE
 	{
 		ResourceName = ElectricCharge
 		Ratio = 2025
 		DumpExcess = false
 		FlowMode = STAGE_PRIORITY_FLOW
 	}
}
}

// 0.00000036111L anti hydrogen gas = 0.000025g  +  0.000027777776666667L liquid hydrogen =  0.000025g  =   0.00005g = 5e-8Kg   
// 5e-8*c² = 4.494 GJ   efficiency=0.045%   =   2 025 000J  =  2 025 Kj
