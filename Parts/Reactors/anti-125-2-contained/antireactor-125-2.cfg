PART
{
	name = OGS-AntiReactor-125-2
	module = Part
	author = Orange Gaming System
	mesh = Model.mu
	scale = 1
	rescaleFactor = 0.455
	node_stack_top = -0.0, 1.575, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = -0.0, -1.575, 0.0, 0.0, -1.0, 0.0, 1
	TechRequired = unifiedFieldTheory
	TechHidden = True
	entryCost = 4314000
	cost = 9650036.75 // Dry cost of 1982000, ksp stores wet cost for no good reason.
	category = Electrical
	subcategory = 0
	title = The Doom Chamber (Self-Contained Version)
	manufacturer = Annihilation Inc.
	description = The Doom Chamber is considered a perfect middle-ground. Big enough to power real ships, but small enough to convince the government to fund your mission. However, all that fuel with containment requirements can get really annoying. Introducing the Self-Contained version of The Doom Chamber. It holds enough hydrogen and antimatter to last 50 years, making it easy to simply place it on your ship.
	attachRules = 1,0,1,0,0
	mass = 0.925
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 10
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 3000
	bulkheadProfiles = size1
	tags = reactor energy antimatter hydrogen
	fuelCrossFeed = False

	RESOURCE
	{
		name = ElectricCharge
		amount = 0
		isTweakable = false
		maxAmount = 500
	}
	RESOURCE
	{
		name = CaptAntimatter
		amount = 76680
		maxAmount = 76680
		isTweakable = true
	}
	RESOURCE
	{
		name = CaptLqdHydrogen
		amount = 1000
		maxAmount = 1000
		isTweakable = true
	}
MODULE
  {
    name = ModuleSystemHeat
    // Cubic metres
    volume = 2
    moduleID = reactorheat
    iconName = Icon_Atom
  }
VABORGANIZER
{
  // The category to assign the part to
  organizerSubcategory = antimatterreactor
}
MODULE
{
	name = ModuleSystemHeatConverter
	moduleID = antimatterreactor
	ConverterName = Antimatter Annihilation
	StartActionName = Start Antimatter Annihilation
	StopActionName = Stop Antimatter Annihilation
	AutoShutdown = true

	// ModuleSystemHeat moduleID to link to
	systemHeatModuleID = reactorheat
	// The shutdown temperature of the part
	shutdownTemperature = 1300

	// The temperature the system contributes to loops
	systemOutletTemperature = 1000

	// Map loop temperature to system efficiency (0-1.0)
	systemEfficiency
	{
    	key = 0 0.0
    	key = 1000 1.0
    	key = 1300 1.0
	}
	// Heat generation (kW)
	systemPower = 25000

	// Maintain 13:1000 ratio between Antimatter LqdHydrogen

	INPUT_RESOURCE
	{
 		ResourceName = CaptLqdHydrogen
 		Ratio = 0.00000216666
 		FlowMode = NO_FLOW
	}
 	INPUT_RESOURCE
 	{
 		ResourceName = CaptAntimatter
 		Ratio = 0.00016666666
		FlowMode = NO_FLOW
 	}
 	OUTPUT_RESOURCE
 	{
 		ResourceName = ElectricCharge
 		Ratio = 16200
 		DumpExcess = false
 		FlowMode = STAGE_PRIORITY_FLOW
 	}
}
}

// 0.00000216666L anti hydrogen gas = 0.00015g  +  0.00000216666L liquid hydrogen =  0.00015g  =   0.0003g = 3e-7Kg   
// 3e-7*c² = 27 GJ   efficiency=0.06%   =   16 200 000J  =  16 200 Kj

