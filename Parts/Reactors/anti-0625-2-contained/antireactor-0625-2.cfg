    volume = 0.25
    moduleID = reactorheat
    iconName = Icon_Atom
  }
VABORGANIZER
{
  // The category to assign the part to
  organizerSubcategory = antimatterreactor
}
MODULE
{
	name = ModuleSystemHeatConverter
	moduleID = antimatterreactor
	ConverterName = Antimatter Annihilation
	StartActionName = Start Antimatter Annihilation
	StopActionName = Stop Antimatter Annihilation
	AutoShutdown = true

	// ModuleSystemHeat moduleID to link to
	systemHeatModuleID = reactorheat
	// The shutdown temperature of the part
	shutdownTemperature = 1300

	// The temperature the system contributes to loops
	systemOutletTemperature = 1000

	// Map loop temperature to system efficiency (0-1.0)
	systemEfficiency
	{
    	key = 0 0.0
    	key = 1000 1.0
    	key = 1300 1.0
	}
	// Heat generation (kW)
	systemPower = 3125

	// Maintain 13:1000 ratio between Antimatter LqdHydrogen

	INPUT_RESOURCE
	{
 		ResourceName = CaptLqdHydrogen
 		Ratio = 0.00000036111
 		FlowMode = STAGE_PRIORITY_FLOW
	}
 	INPUT_RESOURCE
 	{
 		ResourceName = CaptAntimatter
 		Ratio = 0.000027777776666667
 	}
 	OUTPUT_RESOURCE
 	{
 		ResourceName = ElectricCharge
 		Ratio = 2025
 		DumpExcess = false
 		FlowMode = STAGE_PRIORITY_FLOW
 	}
}
}

