PART
{
	name = OGS-AntiReactor-25-1
	module = Part
	author = Orange Gaming System
	mesh = Model.mu
	rescaleFactor = 0.91
	node_stack_top = -0.0, 1.575, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = -0.0, -1.575, 0.0, 0.0, -1.0, 0.0, 2
	TechRequired = largeElectrics
	TechHidden = True
	entryCost = 0
	cost = 5028300
	category = Electrical
	subcategory = 0
	title = The Annihilator
	manufacturer = Annihilation Inc.
	description = "Sometimes in life, less is more. But sometimes, more is more. The Annihilator perfectly proves this... is what our marketing team said. It is the largest commercially available antimatter reactor on the market, and generates approximately way more power than you need. It is also rather efficient, with an efficiency of 0.08%, it out-performs every other antimatter reactor to date (2026-06-20) given identical fuel usage."
	attachRules = 1,01,1,0,0
	mass = 7.4
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 10
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 3000
	bulkheadProfiles = size2, srf
	tags = reactor energy antimatter hydrogen
	RESOURCE

	RESOURCE
	{
		name = ElectricCharge
		amount = 0
		maxAmount = 2500
	}
MODULE
  {
    name = ModuleSystemHeat
    // Cubic metres
    volume = 15.625
    moduleID = reactorheat
    iconName = Icon_Atom
  }
VABORGANIZER
{
  // The category to assign the part to
  organizerSubcategory = antimatterreactor
}
MODULE
{
	name = ModuleSystemHeatConverter
	moduleID = antimatterreactor
	ConverterName = Antimatter Annihilation
	StartActionName = Start Antimatter Annihilation
	StopActionName = Stop Antimatter Annihilation
	AutoShutdown = true

	// ModuleSystemHeat moduleID to link to
	systemHeatModuleID = reactorheat
	// The shutdown temperature of the part
	shutdownTemperature = 1300

	// The temperature the system contributes to loops
	systemOutletTemperature = 1000

	// Map loop temperature to system efficiency (0-1.0)
	systemEfficiency
	{
    	key = 0 0.0
    	key = 1000 1.0
    	key = 1300 1.0
	}
	// Heat generation (kW)
	systemPower = 200000

	// Maintain 13:1000 ratio between Antimatter LqdHydrogen

	INPUT_RESOURCE
	{
 		ResourceName = LqdHydrogen
 		Ratio = 0.000013
 		FlowMode = STAGE_PRIORITY_FLOW
	}
 	INPUT_RESOURCE
 	{
 		ResourceName = Antimatter
 		Ratio = 0.001
 	}
 	OUTPUT_RESOURCE
 	{
 		ResourceName = ElectricCharge
 		Ratio = 129600
 		DumpExcess = false
 		FlowMode = STAGE_PRIORITY_FLOW
 	}
}
}

// 0.001L anti hydrogen gas = 0.0009g  +  0.000013L liquid hydrogen =  0.0009g  =   0.0018g = 0.0000018Kg   
// 0.00000018*c² = 162 000 000 000      efficiency=0.08%   =   129 600 000J  =  129 600 Kj
